<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <link rel="icon" href="data:," />
    <title>Ant Colony – Wild Forest (Web)</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header id="hud">
      <div class="stat" id="stat-food">🍓 <b id="food">0</b></div>
      <div class="stat" id="stat-twigs">🪵 <b id="twigs">0</b></div>
      <div class="stat">🐜 <b id="pop">0/0</b></div>
      <div class="stat">🌊 <b id="wave">-</b></div>
      <div class="hp"><i id="hpbar"></i><span id="hptext"></span></div>
      <div class="ctrl">
        <button id="btnMute" title="เสียง">🔊</button>
        <button id="btnPause" title="หยุด (Space)">⏸</button>
        <button id="btnSpeed" title="ความเร็ว">1×</button>
      </div>
    </header>
    <div id="toasts"></div>
    <div id="rooms" hidden></div>
    <div id="tech" hidden></div>
    <footer id="panel"></footer>
    <div id="overlay">
      <div class="card">
        <h1 id="ovTitle"></h1>
        <p id="ovDesc"></p>
        <ul id="ovHelp"></ul>
        <div class="row">
          <button id="btnContinue" class="primary" hidden></button>
          <button id="btnStart" class="primary"></button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
